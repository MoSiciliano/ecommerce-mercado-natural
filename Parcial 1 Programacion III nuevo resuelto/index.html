<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parcial I</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <script defer src="js/main.js"></script>
  </head>

  <body>
    <!-- Header -->
    <header class="header">
      <a href="index.html">
        <div class="logo">Frutería</div>
      </a>

      <div class="nombreAlumno"></div>

      <input type="text" placeholder="Buscar..." class="barra-busqueda" />

      <div class="carrito">
        <button class="carrito-boton" onclick="abrirCarrito()">
          <i class="fas fa-shopping-cart"></i>
        </button>
        <span>Carrito: <span id="contador-carrito">0</span> productos</span>
      </div>
    </header>

    <!-- Contenedor principal -->
    <main class="main-contenedor">
      <section class="seccion-productos">
        <h2>Nuestras frutas</h2>
        <div class="seccion-productos-ordenar">
          <button onclick="ordenarNombre()">Ordenar por nombre A-Z</button>
          <button onclick="ordenarPrecio()">
            Ordenar por Precio MENOR-MAYOR
          </button>
        </div>

        <div class="contenedor-productos"></div>
      </section>

      <!-- Seccion carrito -->
      <section class="seccion-carrito">
        <div class="seccion-carrito-encabezado">
          <h2>Carrito</h2>
          <button onclick="eliminarCarrito()">❌</button>
        </div>
        <div class="contenedor-items-carrito">
          <ul id="items-carrito">
            <p>No hay elementos en el carrito.</p>
          </ul>
        </div>

        <div class="total-carrito">
          <p>Total: <span id="precio-total">$0.00</span></p>
        </div>
      </section>
    </main>
  </body>
</html>
